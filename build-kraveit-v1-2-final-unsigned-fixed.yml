name: Build KRAVEIT V1.2 Final Unsigned APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract final KRAVEIT V1.2 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-src
          mkdir release-src
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'KRAVEIT_ANDROID_V1_2_DIRECT_RELEASE_READY*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Final KRAVEIT release ZIP not found"
            exit 1
          fi
          echo "Using source: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d release-src

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=$(find release-src -type f -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found after extraction"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Build unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleRelease

      - name: Show APK
        shell: bash
        run: find "$PROJECT_DIR/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' -print

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: KRAVEIT-V1.2-FINAL-unsigned-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
