name: Build KRAVEIT Play-Ready API 36

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract API 36 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-src
          mkdir release-src
          unzip -q "KRAVEIT_ANDROID_V1_2_PLAY_READY_API36_SOURCE (1).zip" -d release-src

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=$(find release-src -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found after extraction"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Build API 36 debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload API 36 test APK
        uses: actions/upload-artifact@v4
        with:
          name: KRAVEIT-V1.2-API36-test
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
