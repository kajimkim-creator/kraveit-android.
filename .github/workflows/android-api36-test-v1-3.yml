name: KRAVEIT V1.3 API 36 Test

on:
  workflow_dispatch:
  push:
    branches:
      - deploy-v1-3
    paths:
      - 'KRAVEIT_ANDROID_V1_3_FINAL.zip'
      - '.github/workflows/android-api36-test-v1-3.yml'

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract V1.3 source
        run: |
          rm -rf release-src
          mkdir -p release-src
          unzip -q KRAVEIT_ANDROID_V1_3_FINAL.zip -d release-src
          PROJECT_DIR="$(dirname "$(find release-src -type f -name settings.gradle.kts -print -quit)")"
          test -n "$PROJECT_DIR" || (echo "Android project not found in V1.3 ZIP" && exit 1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify V1.3 metadata
        run: |
          grep -q 'versionName = "1.3.0"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'versionCode = 4' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'targetSdk = 36' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'applicationId = "ke.co.kraveit.app"' "$PROJECT_DIR/app/build.gradle.kts"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: KRAVEIT-V1.3-API36-test
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
