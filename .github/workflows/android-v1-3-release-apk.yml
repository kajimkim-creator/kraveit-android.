name: KRAVEIT V1.3 Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - deploy-v1-3
    paths:
      - 'KRAVEIT_ANDROID_V1_3_FINAL.zip'
      - '.github/workflows/android-v1-3-release-apk.yml'

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract V1.3 source
        run: |
          test -f KRAVEIT_ANDROID_V1_3_FINAL.zip
          rm -rf release-src
          mkdir release-src
          unzip -q KRAVEIT_ANDROID_V1_3_FINAL.zip -d release-src

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          PROJECT_DIR="$(find release-src -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo 'Android project not found after extraction.' >&2
            exit 1
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

      - name: Verify KRAVEIT V1.3 release config
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          grep -q 'applicationId = "ke.co.kraveit.app"' app/build.gradle.kts
          grep -q 'versionCode = 4' app/build.gradle.kts
          grep -q 'versionName = "1.3.0"' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts

      - name: Build unsigned release APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon assembleRelease

      - name: Locate release APK
        id: apk
        shell: bash
        run: |
          APK_PATH="$(find '${{ steps.project.outputs.dir }}/app/build/outputs/apk/release' -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo 'Release APK not found.' >&2
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          sha256sum "$APK_PATH"

      - name: Upload unsigned V1.3 release APK
        uses: actions/upload-artifact@v4
        with:
          name: KRAVEIT-V1.3.0-unsigned-release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
